<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amigo Invisible 🎁</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #F8F6FF; --surface: #FFFFFF; --fg: #1A1228; --fg2: #6B5E7E;
  --accent: #7C3AED; --accent-t: #EDE9FE; --accent-tx: #6D28D9;
  --gold: #D97706; --gold-t: #FEF3C7;
  --border: #E4DCFA; --r: 14px;
  --ok-bg: #D1FAE5; --ok-fg: #064E3B;
  --err-bg: #FEE2E2; --err-fg: #991B1B;
  --shadow: 0 1px 3px rgba(124,58,237,.07), 0 4px 20px rgba(124,58,237,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0C1A; --surface: #1C1630; --fg: #F0EBFF; --fg2: #A598BE;
    --accent: #9F6EFF; --accent-t: #2D1F5E; --accent-tx: #B98CFF;
    --gold: #FBBF24; --gold-t: #2D2000;
    --border: #2E2450; color-scheme: dark;
    --ok-bg: #052E16; --ok-fg: #86EFAC;
    --err-bg: #450A0A; --err-fg: #FCA5A5;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0C1A; --surface: #1C1630; --fg: #F0EBFF; --fg2: #A598BE;
  --accent: #9F6EFF; --accent-t: #2D1F5E; --accent-tx: #B98CFF;
  --gold: #FBBF24; --gold-t: #2D2000;
  --border: #2E2450; color-scheme: dark;
  --ok-bg: #052E16; --ok-fg: #86EFAC;
  --err-bg: #450A0A; --err-fg: #FCA5A5;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg); color: var(--fg);
  min-height: 100vh;
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: 'Syne', sans-serif; text-wrap: balance; }

/* Layout */
.app { max-width: 500px; margin: 0 auto; padding-block: 40px 60px; }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--fg2); font-size: .875rem; font-weight: 600;
  background: none; border: none; cursor: pointer; padding: 4px 0; margin-bottom: 28px;
}
.back-btn:hover { color: var(--accent); }

/* Header */
.header { text-align: center; margin-bottom: 36px; }
.header .emoji { font-size: 2.5rem; display: block; margin-bottom: 12px; }
.header h1 { font-size: 2rem; font-weight: 800; }
.header p { color: var(--fg2); margin-top: 8px; font-size: .95rem; }

/* Card */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 28px;
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 16px; }

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px 20px; border-radius: 10px;
  font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 700;
  cursor: pointer; border: none; transition: all .15s;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-tx); }
.btn-secondary {
  background: var(--accent-t); color: var(--accent-tx);
  border: 1.5px solid var(--border);
}
.btn-secondary:hover:not(:disabled) { background: var(--border); }
.btn-ghost { background: transparent; color: var(--fg2); border: 1.5px solid var(--border); }
.btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn + .btn { margin-top: 10px; }

/* Form elements */
label { display: block; font-size: .875rem; font-weight: 700; color: var(--fg2); margin-bottom: 6px; letter-spacing: .02em; text-transform: uppercase; }
input, select, textarea {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--bg); color: var(--fg);
  font-family: 'Nunito', sans-serif; font-size: 1rem;
  transition: border-color .15s;
  appearance: none;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; min-height: 100px; }
.field { margin-bottom: 18px; }

/* Status messages */
.msg {
  padding: 12px 16px; border-radius: 10px;
  font-weight: 600; font-size: .9rem; margin-top: 14px;
}
.msg-ok { background: var(--ok-bg); color: var(--ok-fg); }
.msg-err { background: var(--err-bg); color: var(--err-fg); }

/* Home view */
.home-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.action-card {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 20px; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: var(--r);
  cursor: pointer; transition: all .15s; text-align: left;
}
.action-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
.action-icon { font-size: 1.75rem; flex-shrink: 0; }
.action-title { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; }
.action-desc { font-size: .825rem; color: var(--fg2); margin-top: 2px; }

/* Admin link */
.admin-link { text-align: center; margin-top: 28px; }
.admin-link button {
  background: none; border: none; color: var(--fg2); font-size: .8rem;
  cursor: pointer; text-decoration: underline; font-family: inherit;
}
.admin-link button:hover { color: var(--accent); }

/* Clue list */
.clue-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.clue-item {
  padding: 14px 16px; background: var(--accent-t);
  border-radius: 10px; border-left: 3px solid var(--accent);
}
.clue-text { font-size: .95rem; line-height: 1.5; }
.clue-ts { font-size: .75rem; color: var(--fg2); margin-top: 4px; }
.no-clues { color: var(--fg2); font-style: italic; font-size: .9rem; padding: 12px 0; text-align: center; }

/* Sobre (envelope) */
.sobre-wrap { text-align: center; }
.sobre-envelope {
  width: 120px; height: 90px; margin: 20px auto;
  background: var(--gold-t); border: 2px solid var(--gold);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 3rem; cursor: pointer; transition: transform .2s;
  box-shadow: 0 4px 20px rgba(217,119,6,.2);
  position: relative; overflow: hidden;
}
.sobre-envelope:hover { transform: scale(1.05) rotate(-1deg); }
.sobre-envelope.open {
  animation: openSobre .5s ease-out forwards;
}
@keyframes openSobre {
  0%  { transform: scale(1); }
  40% { transform: scale(1.15) rotate(2deg); }
  100%{ transform: scale(1); }
}
.assignment-reveal {
  margin-top: 20px;
  padding: 20px; background: var(--gold-t);
  border: 2px solid var(--gold); border-radius: var(--r);
  animation: fadeIn .4s ease-out;
}
@keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }
.assignment-label { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.assignment-name { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; margin-top: 4px; color: var(--fg); }

/* Code input */
.code-input {
  font-size: 1.5rem; letter-spacing: .3em; text-align: center;
  font-weight: 700; font-family: 'Syne', sans-serif;
}

/* Summary table */
.summary-grid {
  display: grid; grid-template-columns: 1fr auto auto;
  gap: 0; margin-top: 16px;
  border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
}
.sg-head { background: var(--accent-t); font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--fg2); padding: 8px 14px; }
.sg-cell { padding: 10px 14px; font-size: .9rem; border-top: 1px solid var(--border); }
.sg-cell:first-child { font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.dot-green { background: #10B981; }
.dot-gray  { background: var(--border); }

[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app" id="root"></div>

<script>
const PARTICIPANTS = ['Agus','Cin','Darka','Eri','Gabi','Juli','Kari','Lali','Maru','Tati','Vikz'];

async function api(method, endpoint, body) {
  try {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch('/api/' + endpoint, opts);
    return await res.json();
  } catch(e) { return { error: 'network_error' }; }
}

function errText(code) {
  const m = {
    wrong_code:        'Código incorrecto.',
    no_draw:           'El sorteo todavía no se hizo.',
    already_done:      'El sorteo ya estaba hecho.',
    invalid_code_format:'El código debe ser 4 números.',
    too_short:         'La pista es muy corta.',
    network_error:     'Error de conexión. Revisá internet.',
    missing_fields:    'Completá todos los campos.',
  };
  return m[code] || `Error: ${code}`;
}

const root = document.getElementById('root');
function render(html) { root.innerHTML = html; }

// ── HOME ──────────────────────────────────────────────────────────────────────
function showHome() {
  render(`
    <div class="header">
      <span class="emoji">🎁</span>
      <h1>Amigo Invisible</h1>
      <p>¡Ya casi es Navidad!</p>
    </div>
    <div class="home-actions">
      <button class="action-card" onclick="showClue()">
        <span class="action-icon">✉️</span>
        <div>
          <div class="action-title">Dejar una pista</div>
          <div class="action-desc">Mandá una pista anónima a tu amigo invisible</div>
        </div>
      </button>
      <button class="action-card" onclick="showSobre()">
        <span class="action-icon">📨</span>
        <div>
          <div class="action-title">Abrir mi sobre</div>
          <div class="action-desc">Descubrí quién te tocó y leé tus pistas</div>
        </div>
      </button>
    </div>
    <div class="admin-link"><button onclick="showAdmin()">Panel de administración</button></div>
  `);
}

// ── DEJAR PISTA ───────────────────────────────────────────────────────────────
function showClue() {
  const opts = PARTICIPANTS.map(n => `<option value="${n}">${n}</option>`).join('');
  render(`
    <button class="back-btn" onclick="showHome()">← Volver</button>
    <div class="header">
      <span class="emoji">✉️</span>
      <h1>Dejar una pista</h1>
      <p>La pista llega de forma anónima.</p>
    </div>
    <div class="card">
      <div class="field">
        <label for="clue-rec">¿A quién le dejás la pista?</label>
        <select id="clue-rec"><option value="">— Elegí un nombre —</option>${opts}</select>
      </div>
      <div class="field">
        <label for="clue-text">Tu pista</label>
        <textarea id="clue-text" placeholder="Escribí la pista acá..."></textarea>
      </div>
      <button class="btn btn-primary" id="clue-btn" onclick="sendClue()">Enviar pista</button>
      <div id="clue-msg"></div>
    </div>
  `);
}

async function sendClue() {
  const rec  = document.getElementById('clue-rec').value;
  const text = document.getElementById('clue-text').value.trim();
  const btn  = document.getElementById('clue-btn');
  const msg  = document.getElementById('clue-msg');
  if (!rec)  { msg.innerHTML = '<div class="msg msg-err">Elegí un destinatario.</div>'; return; }
  if (!text) { msg.innerHTML = '<div class="msg msg-err">Escribí la pista.</div>'; return; }
  btn.disabled = true;
  btn.textContent = 'Enviando…';
  const r = await api('POST', 'clue', { recipient: rec, text });
  if (r.ok) {
    msg.innerHTML = '<div class="msg msg-ok">✓ Pista enviada con éxito.</div>';
    document.getElementById('clue-rec').value = '';
    document.getElementById('clue-text').value = '';
  } else {
    msg.innerHTML = `<div class="msg msg-err">${errText(r.error)}</div>`;
  }
  btn.disabled = false;
  btn.textContent = 'Enviar pista';
}

// ── MI SOBRE ──────────────────────────────────────────────────────────────────
function showSobre() {
  const opts = PARTICIPANTS.map(n => `<option value="${n}">${n}</option>`).join('');
  render(`
    <button class="back-btn" onclick="showHome()">← Volver</button>
    <div class="header">
      <span class="emoji">📨</span>
      <h1>Mi sobre</h1>
      <p>Abrí el sobre para ver a quién tenés.</p>
    </div>
    <div class="card">
      <div class="field">
        <label for="sobre-name">¿Cuál es tu nombre?</label>
        <select id="sobre-name"><option value="">— Elegí tu nombre —</option>${opts}</select>
      </div>
      <div class="field">
        <label for="sobre-code" id="code-label">Tu código de 4 números</label>
        <input id="sobre-code" class="code-input" type="text" inputmode="numeric"
               maxlength="4" placeholder="0000" autocomplete="off">
        <small id="code-hint" style="color:var(--fg2);font-size:.8rem;margin-top:6px;display:block">
          Si es la primera vez que abrís el sobre, elegí tu código ahora.
        </small>
      </div>
      <button class="btn btn-primary" onclick="openSobre()">Abrir sobre 🎁</button>
      <div id="sobre-msg"></div>
    </div>
    <div id="sobre-result"></div>
  `);
}

async function openSobre() {
  const name = document.getElementById('sobre-name').value;
  const code = document.getElementById('sobre-code').value.trim();
  const msg  = document.getElementById('sobre-msg');
  if (!name) { msg.innerHTML = '<div class="msg msg-err">Elegí tu nombre.</div>'; return; }
  if (!/^\d{4}$/.test(code)) { msg.innerHTML = '<div class="msg msg-err">El código debe ser exactamente 4 números.</div>'; return; }
  msg.innerHTML = '<div class="msg" style="background:var(--accent-t);color:var(--accent-tx)">Abriendo sobre…</div>';

  const r = await api('POST', 'sobre', { name, code });
  if (!r.ok) {
    msg.innerHTML = `<div class="msg msg-err">${errText(r.error)}</div>`;
    return;
  }

  // Animate envelope then show assignment
  msg.innerHTML = '';
  const result = document.getElementById('sobre-result');
  result.innerHTML = `
    <div class="card sobre-wrap">
      <p style="color:var(--fg2);font-size:.9rem;margin-bottom:4px">¡Click para abrir tu sobre!</p>
      <div class="sobre-envelope" id="envelope" onclick="revealAssignment('${r.assignment}','${name}','${code}')">🎁</div>
    </div>
  `;
  result.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function revealAssignment(assignment, name, code) {
  const env = document.getElementById('envelope');
  if (env) { env.classList.add('open'); env.onclick = null; }
  setTimeout(async () => {
    // Load clues in parallel
    const cluesR = await api('GET', `clues/${encodeURIComponent(name)}?code=${code}`);
    const clues = cluesR.ok ? cluesR.clues : [];
    const clueHtml = clues.length
      ? `<ul class="clue-list">${clues.map(c => `<li class="clue-item"><div class="clue-text">${escHtml(c.text)}</div><div class="clue-ts">${c.ts}</div></li>`).join('')}</ul>`
      : '<p class="no-clues">Todavía no tenés pistas.</p>';

    document.getElementById('sobre-result').innerHTML = `
      <div class="card sobre-wrap">
        <div class="assignment-reveal">
          <div class="assignment-label">Tu amigo invisible es</div>
          <div class="assignment-name">${escHtml(assignment)}</div>
        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3 style="font-family:'Syne',sans-serif;font-size:1rem;margin-bottom:4px">Tus pistas 💌</h3>
        <p style="color:var(--fg2);font-size:.8rem;margin-bottom:4px">Las pistas que te dejó tu amigo invisible:</p>
        ${clueHtml}
      </div>
    `;
  }, 600);
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
function showAdmin() {
  render(`
    <button class="back-btn" onclick="showHome()">← Volver</button>
    <div class="header">
      <span class="emoji">🔒</span>
      <h1>Admin</h1>
      <p>Solo para quien organiza el juego.</p>
    </div>
    <div class="card">
      <div class="field">
        <label for="admin-code">Contraseña</label>
        <input id="admin-code" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" onclick="adminLogin()">Ingresar</button>
      <div id="admin-msg"></div>
    </div>
    <div id="admin-panel"></div>
  `);
  document.getElementById('admin-code').addEventListener('keydown', e => { if (e.key === 'Enter') adminLogin(); });
}

async function adminLogin() {
  const pw  = document.getElementById('admin-code').value;
  const msg = document.getElementById('admin-msg');
  msg.innerHTML = '<div class="msg" style="background:var(--accent-t);color:var(--accent-tx)">Cargando…</div>';
  const r = await api('POST', 'admin/summary', { adminCode: pw });
  if (!r.ok) { msg.innerHTML = `<div class="msg msg-err">${errText(r.error)}</div>`; return; }
  msg.innerHTML = '';
  renderAdminPanel(r, pw);
}

function renderAdminPanel(data, pw) {
  const rows = data.summary.map(s => `
    <div class="sg-cell">${escHtml(s.name)}</div>
    <div class="sg-cell" style="text-align:center">${s.clueCount}</div>
    <div class="sg-cell" style="text-align:center"><span class="dot ${s.hasCode ? 'dot-green' : 'dot-gray'}"></span></div>
  `).join('');

  const drawSection = data.drawDone
    ? `<div class="msg msg-ok">✓ El sorteo ya está hecho. Cada participante puede abrir su sobre.</div>`
    : `<button class="btn btn-primary" id="draw-btn" onclick="doDraw('${pw}')">Hacer el sorteo ahora 🎲</button>
       <p style="color:var(--fg2);font-size:.8rem;margin-top:8px;text-align:center">El sorteo es ciego: vos no ves los resultados.</p>`;

  document.getElementById('admin-panel').innerHTML = `
    <div class="card" style="margin-top:16px">
      <h3 style="font-family:'Syne',sans-serif;font-weight:700;margin-bottom:16px">Sorteo</h3>
      ${drawSection}
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="font-family:'Syne',sans-serif;font-weight:700;margin-bottom:4px">Estado</h3>
      <p style="color:var(--fg2);font-size:.8rem;margin-bottom:12px">Pistas recibidas y sobres abiertos.</p>
      <div class="summary-grid">
        <div class="sg-head">Nombre</div>
        <div class="sg-head" style="text-align:center">Pistas</div>
        <div class="sg-head" style="text-align:center">Sobre</div>
        ${rows}
      </div>
    </div>
  `;
}

async function doDraw(pw) {
  const btn = document.getElementById('draw-btn');
  if (!confirm('¿Segura? El sorteo no se puede deshacer.')) return;
  btn.disabled = true;
  btn.textContent = 'Sorteando…';
  const r = await api('POST', 'draw', { adminCode: pw });
  if (r.ok) {
    const summary = await api('POST', 'admin/summary', { adminCode: pw });
    if (summary.ok) renderAdminPanel(summary, pw);
  } else {
    btn.disabled = false;
    btn.textContent = 'Hacer el sorteo ahora 🎲';
    alert(errText(r.error));
  }
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

showHome();
</script>
</body>
</html>
